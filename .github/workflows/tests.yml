name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check all Python files
        run: python -m compileall -q src scripts quantum tests

      - name: Run pure-Python test suite
        run: |
          set +e
          pytest tests/ -v
          code=$?
          if [ $code -eq 5 ]; then
            echo "No tests collected yet - tests/ has no logic to test yet, not a CI failure."
            exit 0
          fi
          exit $code
