
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .wrap { padding: 1rem 0; }
  .header { text-align: center; margin-bottom: 1.5rem; }
  .header h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .header p { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
  .phase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 1.5rem; }
  .phase-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .phase-card:hover { border-color: var(--color-border-primary); background: var(--color-background-secondary); }
  .phase-card.active { border-color: var(--color-border-info); background: var(--color-background-info); }
  .phase-num { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 2px; }
  .phase-card.active .phase-num { color: var(--color-text-info); }
  .phase-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
  .phase-card.active .phase-name { color: var(--color-text-info); }
  .phase-week { font-size: 11px; color: var(--color-text-secondary); margin-top: 3px; }
  .detail-panel { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; }
  .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .detail-badge { font-size: 12px; padding: 3px 10px; border-radius: var(--border-radius-md); background: var(--color-background-info); color: var(--color-text-info); font-weight: 500; }
  .detail-title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
  .task-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem; }
  .task-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--color-text-primary); }
  .task-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-border-secondary); flex-shrink: 0; margin-top: 5px; }
  .task-item.key .task-dot { background: var(--color-text-info); }
  .meta-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .meta-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; }
  .meta-label { font-size: 11px; color: var(--color-text-secondary); }
  .meta-val { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-top: 2px; }
  .arch-section { margin-top: 1.25rem; }
  .arch-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stack-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 100px; border: 0.5px solid var(--color-border-tertiary); color: var(--color-text-secondary); }
  .nav-btns { display: flex; gap: 8px; margin-top: 1rem; }
  .nav-btn { flex: 1; padding: 7px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); background: transparent; border-radius: var(--border-radius-md); color: var(--color-text-primary); cursor: pointer; }
  .nav-btn:hover { background: var(--color-background-secondary); }
  .ask-btn { margin-top: 8px; width: 100%; padding: 8px; font-size: 13px; border: 0.5px solid var(--color-border-info); background: var(--color-background-info); color: var(--color-text-info); border-radius: var(--border-radius-md); cursor: pointer; }
  .ask-btn:hover { opacity: 0.85; }
</style>
<div class="wrap">
  <div class="header">
    <h2>Lunar rover — quantum navigation</h2>
    <p>12-phase project roadmap · click any phase to explore</p>
  </div>
  <div class="phase-grid" id="grid"></div>
  <div class="detail-panel" id="detail"></div>
</div>
<script>
const phases = [
  { num: 1, name: "Planning", week: "Week 1", diff: "⭐", time: "2–3 days",
    tasks: ["Define system architecture", "Map ROS2 nodes & topics", "Create folder structure", "Set up GitHub repo", "Define energy cost model"],
    key: [0,1,4],
    stack: ["Git", "GitHub", "Paper & Pen"],
    output: "Architecture diagram, GitHub repo, folder skeleton" },
  { num: 2, name: "Env Setup", week: "Week 2", diff: "⭐⭐", time: "2–3 days",
    tasks: ["Install Ubuntu 22.04", "Install ROS2 Humble", "Install Gazebo", "Install Qiskit + Aer", "Set up VS Code + extensions"],
    key: [1,3],
    stack: ["Ubuntu 22.04", "ROS2 Humble", "Gazebo", "Qiskit", "VS Code"],
    output: "All tools installed, basic ROS2 test passes" },
  { num: 3, name: "Simulation", week: "Week 3", diff: "⭐⭐", time: "3–4 days",
    tasks: ["Create lunar terrain in Gazebo", "Write rover URDF/Xacro", "Attach virtual sensors", "Test keyboard movement", "Visualize in RViz2"],
    key: [0,1,2],
    stack: ["Gazebo", "URDF", "RViz2", "Python"],
    output: "Rover moves in lunar terrain, sensors publishing" },
  { num: 4, name: "Sensors", week: "Week 4", diff: "⭐⭐", time: "3 days",
    tasks: ["LiDAR processor node", "IMU processor node", "Encoder odometry node", "Test ROS2 topics", "Validate sensor data"],
    key: [0,1,2],
    stack: ["ROS2", "sensor_msgs", "Python"],
    output: "/scan, /imu/data, /odom topics live" },
  { num: 5, name: "Mapping", week: "Week 5", diff: "⭐⭐⭐", time: "4 days",
    tasks: ["Build occupancy grid", "Terrain classification node", "Label flat/rocky/craters", "Visualize map in RViz2", "Store terrain data"],
    key: [0,1],
    stack: ["nav_msgs", "OpenCV", "NumPy"],
    output: "Classified terrain map updating in real time" },
  { num: 6, name: "Energy Model", week: "Week 6", diff: "⭐⭐⭐", time: "3 days",
    tasks: ["Define energy cost function", "Slope-based weight assignment", "Terrain type multipliers", "Roughness factor from LiDAR", "Publish weighted graph"],
    key: [0,2,4],
    stack: ["Python", "NumPy", "NetworkX"],
    output: "Energy-weighted terrain graph as NetworkX object" },
  { num: 7, name: "Classical Plan", week: "Week 7", diff: "⭐⭐⭐", time: "3–4 days",
    tasks: ["Implement Dijkstra algorithm", "Implement A* algorithm", "Compare results", "Publish path as ROS2 topic", "Measure energy usage"],
    key: [0,1,3],
    stack: ["NetworkX", "Python", "ROS2"],
    output: "A* path published on /path/classical" },
  { num: 8, name: "Quantum Opt", week: "Weeks 8–9", diff: "⭐⭐⭐⭐", time: "6–7 days",
    tasks: ["Formulate terrain as QUBO", "Build QAOA circuit in Qiskit", "Run on AerSimulator", "Extract optimal waypoints", "Compare vs classical"],
    key: [0,1,2,3],
    stack: ["Qiskit", "Qiskit-Aer", "QAOA", "Python"],
    output: "Optimized quantum path published on /path/quantum" },
  { num: 9, name: "Integration", week: "Week 10", diff: "⭐⭐⭐", time: "4 days",
    tasks: ["Connect optimizer to ROS2", "Path executor node", "Send waypoints to motors", "Full pipeline test", "End-to-end navigation run"],
    key: [2,3],
    stack: ["ROS2", "Nav2", "Python"],
    output: "Full pipeline: sensor → quantum → motors" },
  { num: 10, name: "Evaluation", week: "Week 11", diff: "⭐⭐", time: "3 days",
    tasks: ["Record energy usage metrics", "Compare classical vs quantum", "Plot energy comparison graphs", "Compute path efficiency", "Document results"],
    key: [1,2,4],
    stack: ["Matplotlib", "Pandas", "Python"],
    output: "Graphs proving quantum saves energy" },
  { num: 11, name: "Real Robot", week: "Week 12 (pt 1)", diff: "⭐⭐⭐⭐", time: "3 days",
    tasks: ["Connect Arjuna hardware", "Flash Arduino firmware", "Map ROS2 to real motors", "Run live navigation", "Debug real-world issues"],
    key: [0,3,4],
    stack: ["Arjuna Kit", "Arduino", "Jetson Nano"],
    output: "Physical rover navigating lunar-like terrain" },
  { num: 12, name: "Docs & Report", week: "Week 12 (pt 2)", diff: "⭐", time: "2–3 days",
    tasks: ["Write final report", "Build presentation slides", "Create GitHub README", "Prepare viva answers", "Research paper guidance"],
    key: [0,2,4],
    stack: ["LaTeX", "PowerPoint", "GitHub"],
    output: "Full report, slides, GitHub README, paper draft" },
];

let active = 0;

function renderGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = phases.map((p, i) => `
    <div class="phase-card ${i===active?'active':''}" onclick="select(${i})">
      <div class="phase-num">Phase ${p.num}</div>
      <div class="phase-name">${p.name}</div>
      <div class="phase-week">${p.week}</div>
    </div>`).join('');
}

function renderDetail() {
  const p = phases[active];
  const tasks = p.tasks.map((t, i) => `
    <li class="task-item ${p.key.includes(i)?'key':''}">
      <div class="task-dot"></div><span>${t}</span>
    </li>`).join('');
  const pills = p.stack.map(s => `<span class="pill">${s}</span>`).join('');
  document.getElementById('detail').innerHTML = `
    <div class="detail-header">
      <span class="detail-badge">Phase ${p.num}</span>
      <span class="detail-title">${p.name}</span>
    </div>
    <ul class="task-list">${tasks}</ul>
    <div class="meta-row">
      <div class="meta-card"><div class="meta-label">Duration</div><div class="meta-val">${p.time}</div></div>
      <div class="meta-card"><div class="meta-label">Difficulty</div><div class="meta-val">${p.diff}</div></div>
      <div class="meta-card"><div class="meta-label">Timeline</div><div class="meta-val">${p.week}</div></div>
    </div>
    <div class="arch-section">
      <div class="arch-label">Tools & Stack</div>
      <div class="stack-pills">${pills}</div>
    </div>
    <div class="arch-section">
      <div class="arch-label">Deliverable</div>
      <div style="font-size:13px;color:var(--color-text-primary)">${p.output}</div>
    </div>
    <div class="nav-btns">
      ${active>0?`<button class="nav-btn" onclick="select(${active-1})">← Phase ${p.num-1}</button>`:'<span></span>'}
      ${active<phases.length-1?`<button class="nav-btn" onclick="select(${active+1})">Phase ${p.num+1} →</button>`:'<span></span>'}
    </div>
    <button class="ask-btn" onclick="sendPrompt('Give me Phase ${p.num} (${p.name}) full implementation details for the lunar rover quantum project')">Get Phase ${p.num} details ↗</button>
  `;
}

function select(i) { active = i; renderGrid(); renderDetail(); }
renderGrid(); renderDetail();
</script>
