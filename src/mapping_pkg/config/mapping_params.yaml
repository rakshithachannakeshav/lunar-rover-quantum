occupancy_grid_node:
  ros__parameters:
    resolution: 0.05
    width_m: 30.0
    height_m: 30.0
    origin_x: -17.0
    origin_y: -15.0
    l_occ: 0.85
    l_free: -0.4
    l_min: -2.0
    l_max: 3.5
    publish_rate: 2.0
    map_frame: 'map'
    odom_frame: 'odom'
    broadcast_static_tf: true

terrain_classifier_node:
  ros__parameters:
    roughness_window: 5
    roughness_threshold: 0.02
    crater_min_radius_px: 8
    crater_max_radius_px: 80
    hough_dp: 1.2
    hough_param1: 50.0
    hough_param2: 20.0
    hough_min_dist: 15.0
    viz_downsample: 3
    classification_rate: 1.0
    save_interval_sec: 10.0
    keep_history: false
    output_dir: ''
    map_frame: 'map'
